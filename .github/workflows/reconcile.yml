name: Scheduled Index Reconciliation (P6.2.4)

on:
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: content-ingestion
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Sanity, PostgreSQL and Qdrant
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pipelines/requirements.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipelines/requirements.txt

      - name: Validate pipeline configuration and credentials
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET || 'production' }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          ENVIRONMENT: production
        run: |
          python -c "from apps.api.core.config import get_settings, validate_qdrant_credentials; s = get_settings(); validate_qdrant_credentials(s.QDRANT_URL, s.QDRANT_API_KEY, require_api_key=True); assert s.DATABASE_URL.strip(), 'DATABASE_URL is required'; print(f'[reconcile] Configuration verified for env={s.ENVIRONMENT}, collection={s.QDRANT_COLLECTION_NAME}')"

      - name: Execute Reconciliation and Auto-Repair
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET || 'production' }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          ENVIRONMENT: production
        run: |
          echo "Executing three-way reconciliation audit and repair..."
          python -m pipelines.reconciliation --repair
