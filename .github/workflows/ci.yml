name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Install Playwright browsers and system dependencies
        run: pnpm --filter @mahad/web exec playwright install --with-deps chromium

      - name: Run Playwright smoke and accessibility tests
        run: pnpm test:e2e

      - name: Upload Playwright Failure Artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  eval-gate:
    name: LLMOps Regression Gate & Pipeline Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pipelines/requirements.txt"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipelines/requirements.txt

      - name: Verify Reconciliation and Index Rebuild Startup & Mock Execution
        run: |
          python -m pipelines.reconciliation --mock
          python -m pipelines.rebuild_index --confirm-rebuild --mock

      - name: Run Qdrant Configuration & Reconciliation Dependency Unit Tests
        run: pytest apps/api/tests/test_qdrant_config_auth.py pipelines/tests/test_reconciliation_dependencies.py

      - name: Run Deterministic Evaluation Suite
        run: python -m pipelines.evaluation.evaluate_assistant

      - name: Run Regression Gate Unit Tests
        run: pytest pipelines/tests/test_evaluation_regression_gate.py

      - name: Upload Evaluation Summary Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-summary
          path: pipelines/evaluation/reports/evaluation_summary.md
