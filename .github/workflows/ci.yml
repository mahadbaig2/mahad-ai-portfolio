name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Install Playwright browsers and system dependencies
        run: pnpm --filter @mahad/web exec playwright install --with-deps chromium

      - name: Run Playwright smoke and accessibility tests
        run: pnpm test:e2e

  eval-gate:
    name: LLMOps Regression Gate & CI Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest

      - name: Run Deterministic Evaluation Suite
        run: python -m pipelines.evaluation.evaluate_assistant

      - name: Run Regression Gate Unit Tests
        run: pytest pipelines/tests/test_evaluation_regression_gate.py

      - name: Upload Evaluation Summary Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-summary
          path: pipelines/evaluation/reports/evaluation_summary.md

