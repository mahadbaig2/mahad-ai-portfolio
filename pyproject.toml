[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mahad-ai-portfolio"
version = "0.1.0"
description = "Mahad AI Product Engineering Portfolio"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["apps.api*", "pipelines*"]
exclude = ["*node_modules*", "apps.web*", "apps.studio*", "alembic*", "infra*", "mlruns*", "scratch*", "tests*"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "node_modules",
    "__pycache__",
    "dist",
    "build",
    "alembic",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by formatter)
    "B008", # Do not perform function call in argument defaults (FastAPI Depends)
]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
norecursedirs = [".venv", "node_modules", ".git", "dist", "build"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = [
    "apps/api/tests",
    "pipelines/tests",
]
python_files = ["test_*.py"]
python_functions = ["test_*"]

